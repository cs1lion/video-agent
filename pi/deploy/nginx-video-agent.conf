# video-agent 反代配置（80 → 本机 8080）
#
# 关键点（针对本项目）：
#   - proxy_buffering off        SSE（event: run / event: ev）必须关缓冲，否则事件流被攒住不推
#   - Connection "upgrade"       SSE 长连接升级
#   - proxy_read_timeout 3600s   一次跑批 6-10 分钟，默认 60s 会中途 504
#   - client_max_body_size 100m  参考图上传
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 必需
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 长任务（视频生成 6-10 分钟）+ SSE 不超时
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
}
